# .github/workflows/deploy.yml
name: Deploy Angular App to GitHub Pages

on:
    push:
        branches: [ main ]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6          # ✅ Node 24 native

            - name: Setup Node.js
              uses: actions/setup-node@v6        # ✅ Node 24 native
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build React app
              run:  npm run build

            - name: Setup Pages
              uses: actions/configure-pages@v5   # ⚠️ Still Node 20, no v6 yet

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3  # ⚠️ Still Node 20, no v4 yet
              with:
                  path: './docs'

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4      # ⚠️ Still Node 20, no v5 yet
